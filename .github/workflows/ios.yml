name: iOS build and UI tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Public source checks
        run: python3 scripts/check-public.py
      - name: Core tests
        run: swift test --jobs 2
      - name: Build unsigned device package
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/build-ios.sh device 2>&1 | tee artifacts/ios-build.log
      - name: Select simulators
        run: |
          xcrun simctl list devices available -j > artifacts/simulators.json
          export SIM_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          python3 - <<'PY'
          import json, os, re
          devices = json.load(open('artifacts/simulators.json'))['devices']
          sdk = tuple(int(p) for p in os.environ['SIM_SDK_VERSION'].split('.')[:2])
          compatible = []
          for runtime, entries in devices.items():
              match = re.search(r'\.iOS-(\d+)-(\d+)', runtime)
              if match:
                  version = tuple(map(int, match.groups()))
                  if version <= sdk and entries:
                      compatible.append((version, entries))
          if not compatible:
              raise SystemExit('No available iOS simulator compatible with the selected Xcode SDK')
          version, available = max(compatible, key=lambda item: item[0])
          print('SDK', os.environ['SIM_SDK_VERSION'], 'simulator runtime', version)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for label, prefix in [('PHONE', 'iPhone'), ('TABLET', 'iPad')]:
                  device = next(d for d in available if d['name'].startswith(prefix))
                  env.write(label + '_UDID=' + device['udid'] + '\n')
                  print(label, device['name'])
          PY
      - name: Boot iPhone simulator
        timeout-minutes: 6
        run: |
          xcrun simctl boot "$PHONE_UDID" || true
          xcrun simctl bootstatus "$PHONE_UDID" -b
      - name: iPhone UI and local audio tests
        timeout-minutes: 12
        run: |
          python3 scripts/ios-test-server.py > artifacts/ios-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          set -o pipefail
          xcodebuild -project iOS/MiniRadio.xcodeproj -scheme MiniRadio-iOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$PHONE_UDID" -derivedDataPath artifacts/ios-simulator \
            -resultBundlePath artifacts/iPhone-Tests.xcresult -parallel-testing-enabled NO -jobs 2 test \
            2>&1 | tee artifacts/ios-tests.log
      - name: iPad launch and layout capture
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$TABLET_UDID" || true
          xcrun simctl bootstatus "$TABLET_UDID" -b
          app=artifacts/ios-simulator/Build/Products/Debug-iphonesimulator/MiniRadio.app
          xcrun simctl install "$TABLET_UDID" "$app"
          SIMCTL_CHILD_MINIRADIO_UI_TEST_RUN="$(uuidgen)" xcrun simctl launch --terminate-running-process \
            "$TABLET_UDID" com.stevendong.miniradio.ios --ui-testing
          sleep 6
          mkdir -p artifacts/iPad-screenshots
          xcrun simctl io "$TABLET_UDID" screenshot artifacts/iPad-screenshots/Discovery.png
      - name: Export screenshots
        if: always()
        timeout-minutes: 2
        run: |
          for device in iPhone iPad; do
            result="artifacts/$device-Tests.xcresult"
            if [[ -d "$result" ]]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "artifacts/$device-screenshots" || true
            fi
          done
      - name: Report errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['ios-build.log', 'ios-tests.log', 'ipad-tests.log']:
              p = Path('artifacts') / name
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  useful = [line for line in lines if 'error:' in line.lower() or 'failed' in line.lower() or 'XCTAssert' in line]
                  tail = '\n'.join(useful[-20:]) if useful else '\n'.join(lines[-12:])
                  print('::error::' + (name + '\n' + tail)[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload iOS package and evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MiniRadio-iOS-0.1.0
          path: |
            artifacts/MiniRadio-iOS-0.1.0-unsigned.ipa
            artifacts/iOS-SHA256SUMS
            artifacts/ios-build.log
            artifacts/ios-tests.log
            artifacts/ipad-tests.log
            artifacts/ios-test-server.log
            artifacts/iPhone-screenshots
            artifacts/iPad-screenshots
            iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if-no-files-found: error
          retention-days: 30
