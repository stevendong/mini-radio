name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 scripts/check-public.py
      - name: Core tests
        run: swift test --jobs 2
      - name: Build universal application
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee artifacts/build.log
      - name: Report packaging errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/build.log')
          if p.exists():
              tail = p.read_text()[-6000:]
              print('::error::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Launch probe
        continue-on-error: true
        timeout-minutes: 1
        run: |
          "artifacts/Mini Radio.app/Contents/MacOS/MiniRadio" --smoke-test
          cp "$HOME/Library/Containers/com.stevendong.miniradio/Data/Library/Application Support/MiniRadio/launch-smoke.png" artifacts/launch-smoke.png
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MiniRadio-0.1.1-universal
          path: |
            artifacts/MiniRadio-0.1.1-universal.zip
            artifacts/SHA256SUMS
            artifacts/launch-smoke.png
            artifacts/build.log
          if-no-files-found: error
          retention-days: 30
  preview:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: MiniRadio-0.1.1-universal
          path: artifacts
      - name: Publish test package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/MiniRadio-0.1.1-universal.zip artifacts/SHA256SUMS --prerelease --title "Mini Radio $RELEASE_TAG preview" --notes 'Native macOS 13+ radio preview for Apple Silicon and Intel. Ad-hoc signed; not notarized. UI/audio acceptance on a real Mac remains required.'
