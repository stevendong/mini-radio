name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Public source checks
        run: python3 scripts/check-public.py
      - name: Core tests
        uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Core and two-device sync integration tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          openssl rand 32 > "$RUNNER_TEMP/sync.key"
          SYNC_DATABASE="$RUNNER_TEMP/sync.sqlite" SYNC_MASTER_KEY_FILE="$RUNNER_TEMP/sync.key" \
            node server/admin.mjs invite --count 2 --out "$RUNNER_TEMP/sync-invitations.json"
          PORT=18768 SYNC_DATABASE="$RUNNER_TEMP/sync.sqlite" SYNC_MASTER_KEY_FILE="$RUNNER_TEMP/sync.key" node server/index.mjs &
          server_pid=$!
          python3 scripts/ios-test-server.py > "$RUNNER_TEMP/playback-fixture.log" 2>&1 &
          audio_pid=$!
          trap 'kill "$server_pid" "$audio_pid" || true' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:18768/healthz && break
            sleep 1
          done
          MINIRADIO_SYNC_TEST_URL=http://127.0.0.1:18768 \
            MINIRADIO_PLAYBACK_TEST_URL=http://127.0.0.1:18767/tone.wav \
            MINIRADIO_SYNC_TEST_INVITES_FILE="$RUNNER_TEMP/sync-invitations.json" swift test --jobs 2 2>&1 | tee artifacts/core-tests.log
      - name: Build universal application
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee artifacts/build.log
      - name: Report test or packaging errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['core-tests.log', 'build.log']:
              p = Path('artifacts') / name
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  useful = [line for line in lines if 'error:' in line.lower() or 'failed' in line.lower() or 'XCTAssert' in line]
                  tail = (name + '\n' + '\n'.join(useful[-20:] or lines[-12:]))[-6000:]
                  print('::error::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Launch probe
        continue-on-error: true
        timeout-minutes: 1
        run: |
          "artifacts/Mini Radio.app/Contents/MacOS/MiniRadio" --smoke-test
          cp "$HOME/Library/Containers/com.stevendong.miniradio/Data/Library/Application Support/MiniRadio/launch-smoke.png" artifacts/launch-smoke.png
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MiniRadio-0.2.2-universal
          path: |
            artifacts/MiniRadio-0.2.2-universal.zip
            artifacts/SHA256SUMS
            artifacts/launch-smoke.png
            artifacts/build.log
            artifacts/core-tests.log
          if-no-files-found: error
          retention-days: 30
  preview:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: MiniRadio-0.2.2-universal
          path: artifacts
      - name: Publish test package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/MiniRadio-0.2.2-universal.zip artifacts/SHA256SUMS --prerelease --title "Mini Radio $RELEASE_TAG preview" --notes 'Native macOS 13+ radio preview for Apple Silicon and Intel. Ad-hoc signed; not notarized. UI/audio acceptance on a real Mac remains required.'
